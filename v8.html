<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>Hero Wars: Alliance — Raise Your Hero</title>
<meta name="description" content="Raise Your Hero. Get 1000 emeralds for free. The best mobile RPG 2025." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
/* ------------------------------------------------------------------
   v8 — verbatim Figma 215:8267 (MacBook Pro 16" frame, 1728×1117)
   Hero-only single-screen landing · video bg replaces keyart
------------------------------------------------------------------ */
:root {
  --black: #000;
  --white: #fff;
  --cream: #FFFDED;
  --lime: #87EB6B;
  --play-top: #6ED02F;
  --play-bottom: #3FA319;
  --badge-1: #1FC50E;
  --badge-2: #1BAB0C;
  --badge-3: #149B07;
  --badge-4: #0C8B01;
  --dot-green: #00FF00;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--black); color: var(--white); min-width: 1280px; overflow-x: hidden; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
img, video { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* ── Top nav (107px, transparent, floats over hero video) ──────── */
.nav {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 10;
  background: transparent;
  height: 107px;
  display: flex;
  align-items: center;
  padding: 0 64px;
  gap: 48px;
}
.nav__logo { height: 43px; width: auto; }
.nav__links {
  display: flex;
  gap: 48px;
  margin-left: 48px;
}
.nav__links a {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 14px;
  color: var(--white);
  letter-spacing: 0.02em;
  transition: color 0.2s ease;
}
.nav__links a:hover { color: var(--lime); }
.nav__right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 32px;
}
.players {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--white);
}
.players__dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--dot-green);
  box-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
  position: relative;
  animation: pulse 2s ease-in-out infinite;
}
.players__dot::after {
  content: '';
  position: absolute; inset: 1px;
  border-radius: 50%;
  background: var(--dot-green);
  opacity: 0.85;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(0, 255, 0, 0.6); }
  50% { box-shadow: 0 0 14px rgba(0, 255, 0, 0.95); }
}
.players__text { display: flex; flex-direction: column; line-height: 1; }
.players__count {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.01em;
}
.players__label {
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 14px;
  margin-top: 4px;
  opacity: 0.9;
}

/* Enter button — lime pill */
.btn-enter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 96px;
  height: 49px;
  background: var(--lime);
  color: #111111;
  border-radius: 100px;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.02em;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.btn-enter:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25); }
.btn-enter:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }

/* ── Hero (full viewport minus 107px nav) ──────────────────────── */
.hero {
  position: relative;
  height: 100vh;
  min-height: 820px;
  overflow: hidden;
  isolation: isolate;
}
.hero__video {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: -3;
}
/* Dark gradient overlay (Rectangle 1576 in Figma — 20px backdrop blur, dark veil) */
.hero__overlay {
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.25) 35%, rgba(0, 0, 0, 0.4) 65%, rgba(0, 0, 0, 0.85) 100%),
    linear-gradient(90deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.45) 100%);
}
.hero__vignette {
  position: absolute; inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 0%, rgba(0, 0, 0, 0.5) 85%);
}

/* Hero content — shifted toward lower portion */
.hero__content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 14vh;
}
.hero__title {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-style: italic;
  font-size: 100px;
  line-height: 1;
  color: var(--white);
  letter-spacing: -0.01em;
  text-align: center;
  text-transform: uppercase;
  text-shadow:
    0 8px 24px rgba(0, 0, 0, 0.85),
    0 3px 0 rgba(0, 0, 0, 0.6),
    0 2px 4px rgba(0, 0, 0, 0.5);
  margin-bottom: 60px;
}
.hero__offer {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  margin-top: 32px;
}
.hero__offer-text {
  font-family: 'Roboto', sans-serif;
  font-weight: 500;
  font-size: 36px;
  color: var(--cream);
  letter-spacing: 0.01em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}
.hero__offer-icon {
  width: 39px; height: 39px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
}

/* PLAY NOW button — large 367×117 green gradient pill with badge */
.btn-play {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 367px;
  height: 117px;
  border-radius: 21px;
  background: linear-gradient(180deg, var(--play-top) 0%, var(--play-bottom) 100%);
  cursor: pointer;
  box-shadow:
    0 8px 0 rgba(0, 0, 0, 0.35),
    0 14px 28px rgba(0, 0, 0, 0.5),
    inset 0 -10px 0 rgba(0, 0, 0, 0.15),
    inset 0 2px 0 rgba(255, 255, 255, 0.18);
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}
.btn-play:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35), 0 18px 36px rgba(0, 0, 0, 0.55), inset 0 -10px 0 rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.22); }
.btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 6px 12px rgba(0, 0, 0, 0.5), inset 0 -6px 0 rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.18); }
.btn-play__label {
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
  font-size: 53px;
  color: var(--cream);
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 3px 6px rgba(0, 0, 0, 0.5);
}
.btn-play__badge {
  position: absolute;
  top: -16px;
  right: -16px;
  width: 69px; height: 69px;
  border-radius: 50%;
  background: linear-gradient(180deg, var(--badge-1) 11%, var(--badge-2) 36%, var(--badge-3) 53%, var(--badge-4) 76%);
  display: grid;
  place-items: center;
  box-shadow:
    0 6px 16px rgba(0, 0, 0, 0.6),
    inset 0 -4px 0 rgba(0, 0, 0, 0.2),
    inset 0 2px 0 rgba(255, 255, 255, 0.35),
    0 0 0 4px var(--white);
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
  font-size: 38px;
  color: var(--cream);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}

/* ── Bottom band — single centered award badge ────────────────── */
.band {
  position: absolute;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  z-index: 5;
}
.band__award {
  height: 70px;
  width: auto;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7));
}

/* ── Login modal — frameless, floats over blur backdrop ───────── */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(18px) saturate(0.85);
  -webkit-backdrop-filter: blur(18px) saturate(0.85);
  animation: fade-in 0.25s ease-out;
}
.modal.is-open { display: flex; }
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal__content {
  position: relative;
  width: 100%;
  max-width: 460px;
  text-align: center;
  color: var(--white);
  animation: content-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes content-in {
  from { transform: translateY(14px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal__close {
  position: fixed;
  top: 28px;
  right: 32px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.85);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  z-index: 1001;
}
.modal__close:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.3); transform: rotate(90deg); }

.modal__back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  margin-bottom: 24px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.7);
  border-radius: 6px;
  transition: color 0.15s ease, background 0.15s ease;
}
.modal__back::before { content: '‹'; font-size: 20px; line-height: 1; margin-top: -2px; }
.modal__back:hover { color: var(--white); background: rgba(255, 255, 255, 0.08); }

.modal__title {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 42px;
  line-height: 1.15;
  color: var(--white);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.modal__title-soft {
  display: block;
  font-weight: 500;
  font-size: 42px;
  line-height: 1.15;
  color: rgba(255, 255, 255, 0.55);
  letter-spacing: -0.01em;
}
.modal__subtitle {
  margin-top: 28px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.88);
}
.modal__subtitle strong { font-weight: 600; color: var(--white); }
.modal__email {
  margin-top: 28px;
  width: 100%;
  height: 52px;
  padding: 0 18px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.06);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--white);
  text-align: center;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.modal__email::placeholder { color: rgba(255, 255, 255, 0.45); }
.modal__email:focus { border-color: rgba(110, 208, 47, 0.7); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 4px rgba(110, 208, 47, 0.15); }
.modal__email.is-error { border-color: rgba(231, 76, 60, 0.7); box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.12); }

.btn-login {
  margin-top: 16px;
  width: 100%;
  height: 56px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--play-top) 0%, var(--play-bottom) 100%);
  color: var(--cream);
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  box-shadow:
    0 5px 0 rgba(0, 0, 0, 0.25),
    0 8px 22px rgba(63, 163, 25, 0.35),
    inset 0 -5px 0 rgba(0, 0, 0, 0.15),
    inset 0 2px 0 rgba(255, 255, 255, 0.2);
  transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
}
.btn-login:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-login:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), 0 4px 10px rgba(63, 163, 25, 0.3), inset 0 -4px 0 rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.2); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: none; }

/* Stage 2 — code entry */
.modal__code-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 22px;
}
.modal__code-input {
  width: 44px;
  height: 52px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 22px;
  color: var(--white);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.modal__code-input:focus { border-color: rgba(110, 208, 47, 0.7); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 3px rgba(110, 208, 47, 0.15); }
.modal__resend {
  margin-top: 32px;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.6);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.15s ease;
}
.modal__resend:hover { color: var(--white); }
.modal__resend:disabled { color: rgba(255, 255, 255, 0.35); cursor: not-allowed; }

.stage { display: none; flex-direction: column; align-items: stretch; }
.stage.is-active { display: flex; }
</style>
</head>
<body>

<header class="nav">
  <img src="assets/v8/logo.png" alt="Hero Wars Alliance" class="nav__logo" />

  <nav class="nav__links" aria-label="Primary">
    <a href="#shop">Shop</a>
    <a href="#news">News</a>
    <a href="#bonuses">Bonuses</a>
  </nav>

  <div class="nav__right">
    <div class="players">
      <span class="players__dot"></span>
      <div class="players__text">
        <span class="players__count">253 434</span>
        <span class="players__label">players online</span>
      </div>
    </div>
    <a href="#enter" class="btn-enter">Enter</a>
  </div>
</header>

<section class="hero">
  <video class="hero__video" autoplay muted loop playsinline preload="auto">
    <source src="assets/hero-bg.mp4" type="video/mp4" />
  </video>
  <div class="hero__overlay"></div>
  <div class="hero__vignette"></div>

  <div class="hero__content">
    <h1 class="hero__title">Raise Your Hero</h1>

    <a href="#play" class="btn-play">
      <span class="btn-play__label">PLAY NOW</span>
    </a>

    <div class="hero__offer">
      <span class="hero__offer-text">GET</span>
      <img src="assets/v8/emerald.png" alt="" class="hero__offer-icon" />
      <span class="hero__offer-text">1000 FOR FREE</span>
    </div>
  </div>

  <div class="band">
    <img src="assets/award.png" alt="The Best Mobile RPG 2025" class="band__award" />
  </div>
</section>

<div class="modal" id="loginModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
  <button class="modal__close" type="button" aria-label="Close" data-modal-close>×</button>

  <div class="modal__content">
    <!-- Stage 1: email entry -->
    <div class="stage is-active" data-stage="email">
      <h2 class="modal__title" id="modalTitle">Welcome to<br/><span class="modal__title-soft">Hero Wars Alliance</span></h2>
      <p class="modal__subtitle">Enter your email to log in or create an account.</p>
      <input type="email" class="modal__email" id="emailInput" placeholder="email@gmail.com" autocomplete="email" />
      <button type="button" class="btn-login" id="getCodeBtn">Get a login code</button>
    </div>

    <!-- Stage 2: code entry -->
    <div class="stage" data-stage="code">
      <button class="modal__back" type="button" data-stage-back>Back</button>
      <h2 class="modal__title">Welcome to<br/><span class="modal__title-soft">Hero Wars Alliance</span></h2>
      <p class="modal__subtitle">We've sent a sign-in code to <strong id="sentEmail">you</strong>.<br/>Enter the code from your email below.</p>
      <div class="modal__code-row">
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" class="modal__code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
      </div>
      <button type="button" class="modal__resend" id="resendBtn" disabled>Resend email (16s)</button>
    </div>
  </div>
</div>

<script>
// Video autoplay
const video = document.querySelector('.hero__video');
if (video) video.play().catch(() => {});

// Modal control
const modal = document.getElementById('loginModal');
const emailInput = document.getElementById('emailInput');
const getCodeBtn = document.getElementById('getCodeBtn');
const sentEmail = document.getElementById('sentEmail');
const stages = modal.querySelectorAll('.stage');
const codeInputs = modal.querySelectorAll('.modal__code-input');
const resendBtn = document.getElementById('resendBtn');

let resendTimer = null;

function openModal() {
  modal.classList.add('is-open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  setTimeout(() => emailInput.focus(), 300);
}

function closeModal() {
  modal.classList.remove('is-open');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  showStage('email');
  if (resendTimer) { clearInterval(resendTimer); resendTimer = null; }
}

function showStage(name) {
  stages.forEach(s => s.classList.toggle('is-active', s.dataset.stage === name));
}

function startResendCountdown() {
  let s = 16;
  resendBtn.disabled = true;
  resendBtn.textContent = `Resend email (${s}s)`;
  if (resendTimer) clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    s -= 1;
    if (s <= 0) {
      clearInterval(resendTimer);
      resendTimer = null;
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend email';
    } else {
      resendBtn.textContent = `Resend email (${s}s)`;
    }
  }, 1000);
}

// Open triggers
document.querySelector('.btn-play').addEventListener('click', (e) => { e.preventDefault(); openModal(); });
document.querySelector('.btn-enter').addEventListener('click', (e) => { e.preventDefault(); openModal(); });

// Close triggers
modal.querySelector('[data-modal-close]').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal(); });

// Back to email stage
modal.querySelector('[data-stage-back]').addEventListener('click', () => showStage('email'));

// Email submit
function submitEmail() {
  const v = emailInput.value.trim();
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if (!valid) {
    emailInput.classList.add('is-error');
    emailInput.focus();
    return;
  }
  emailInput.classList.remove('is-error');
  sentEmail.textContent = v;
  showStage('code');
  setTimeout(() => codeInputs[0].focus(), 200);
  startResendCountdown();
}
getCodeBtn.addEventListener('click', submitEmail);
emailInput.addEventListener('input', () => emailInput.classList.remove('is-error'));
emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitEmail(); });

// 6-digit code input behavior
codeInputs.forEach((input, i) => {
  input.addEventListener('input', (e) => {
    const v = e.target.value.replace(/\D/g, '');
    e.target.value = v.slice(0, 1);
    if (e.target.value && i < codeInputs.length - 1) codeInputs[i + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && i > 0) codeInputs[i - 1].focus();
    if (e.key === 'ArrowLeft' && i > 0) codeInputs[i - 1].focus();
    if (e.key === 'ArrowRight' && i < codeInputs.length - 1) codeInputs[i + 1].focus();
  });
  input.addEventListener('paste', (e) => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    digits.split('').forEach((d, idx) => { if (codeInputs[idx]) codeInputs[idx].value = d; });
    const next = Math.min(digits.length, codeInputs.length - 1);
    codeInputs[next].focus();
  });
});

resendBtn.addEventListener('click', () => { if (!resendBtn.disabled) startResendCountdown(); });
</script>
</body>
</html>
